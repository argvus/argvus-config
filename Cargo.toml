[package]
name = "argvus-config"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.94"
description = "Canonical ARGVUS user configuration model and command-line interface"

[lib]
name = "argvus_config_core"
path = "src/lib.rs"

[[bin]]
name = "argvus-config"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
